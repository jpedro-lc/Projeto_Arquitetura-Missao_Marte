spring.application.name=missao-marte-servidor

# Escuta apenas a propria maquina. Para abrir na rede use -Dserver.address=0.0.0.0 (e HTTPS).
server.address=127.0.0.1
server.port=8080

# H2 em arquivo; troque a pasta com a variavel MISSAOMARTE_DADOS.
spring.datasource.url=jdbc:h2:file:${MISSAOMARTE_DADOS:./dados}/missaomarte
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria/ajusta tabelas. Producao: migracoes versionadas (Flyway), nunca update.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Segredo do JWT (>= 32 bytes) vem do ambiente. Vazio: segredo aleatorio a cada inicio.
missaomarte.seguranca.segredo=${MISSAOMARTE_JWT_SEGREDO:}
missaomarte.seguranca.validade=2h

springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.operationsSorter=method
