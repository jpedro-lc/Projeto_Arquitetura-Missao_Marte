ext {
    gdxVersion = '1.12.1'
    roboVMVersion = '2.3.21'
    box2DLightsVersion = '1.5'
    javaVersion = '17'
}

allprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.toVersion(javaVersion)
        targetCompatibility = JavaVersion.toVersion(javaVersion)
    }

    repositories {
        mavenCentral()
        maven { url 'https://s01.oss.sonatype.org' }
        google()
    }
}
