plugins {
    id 'application'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'br.unifor.missaomarte.lwjgl3.Lwjgl3Launcher'
    // GLFW precisa iniciar na primeira thread no macOS.
    if (System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('mac')) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

sourceSets.main.resources.srcDir rootProject.file('core/assets')

tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
    // -Dmissaomarte.servidor=... na linha do Gradle chega ao jogo (padrao: http://localhost:8080).
    systemProperty 'missaomarte.servidor', System.getProperty('missaomarte.servidor', 'http://localhost:8080')
}

tasks.register('runConsole', JavaExec) {
    group = 'application'
    description = 'Executa a interface de console preservada.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'br.unifor.missaomarte.lwjgl3.console.MainConsole'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    standardInput = System.in
    workingDir = rootProject.projectDir
}

// Verificação gráfica explícita: build/test comuns continuam sem exigir display.
tasks.register('smokeDesktop', JavaExec) {
    group = 'verification'
    description = 'Abre uma janela real e verifica render, resize e descarte.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.unifor.missaomarte.lwjgl3.VerificacaoDesktop'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    jvmArgs application.applicationDefaultJvmArgs
    workingDir = rootProject.projectDir
    args providers.gradleProperty('smokeOutput')
            .getOrElse(layout.buildDirectory.dir('reports/smoke').get().asFile.absolutePath)
}

// Fase 7: janela e relógio reais; a partida em tempo real anda sozinha até a vitória.
tasks.register('smokeTempoReal', JavaExec) {
    group = 'verification'
    description = 'Abre a janela e joga o modo tempo real: contagem, segurar direção, embarque automático, pausa e vitória.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.unifor.missaomarte.lwjgl3.VerificacaoTempoReal'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    jvmArgs application.applicationDefaultJvmArgs
    workingDir = rootProject.projectDir
    args providers.gradleProperty('smokeOutput')
            .getOrElse(layout.buildDirectory.dir('reports/smoke-tempo-real').get().asFile.absolutePath)
}

tasks.register('smokeInfinito', JavaExec) {
    group = 'verification'
    description = 'Abre a janela e joga o modo Infinito: setor 1, setor 2, fim da corrida e aba Infinito do ranking local.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.unifor.missaomarte.lwjgl3.VerificacaoInfinito'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    jvmArgs application.applicationDefaultJvmArgs
    workingDir = rootProject.projectDir
    args providers.gradleProperty('smokeOutput')
            .getOrElse(layout.buildDirectory.dir('reports/smoke-infinito').get().asFile.absolutePath)
}

// Ponta a ponta: exige o servidor no ar (cd ../servidor; gradlew bootRun). Gera as capturas da Fase 5.
tasks.register('smokeOnline', JavaExec) {
    group = 'verification'
    description = 'Abre a janela contra o servidor real: cadastro, login, envio, ranking, historico e falhas.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.unifor.missaomarte.lwjgl3.VerificacaoOnline'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    jvmArgs application.applicationDefaultJvmArgs
    workingDir = rootProject.projectDir
    args layout.buildDirectory.dir('reports/smoke-online').get().asFile.absolutePath,
            System.getProperty('missaomarte.servidor', 'http://localhost:8080')
}

// Apresentação: pasta com o jogo, um Java 17 embutido (jlink) e "Jogar Missao Marte.bat", já apontando para o
// servidor do Render. Roda em outro Windows sem instalar nada. Outro servidor: -PservidorPacote=https://...
// Por que não um .exe do jpackage: o launcher gerado não é assinado e o Smart App Control do Windows 11 o bloqueia;
// o javaw.exe copiado pelo jlink é o original do JDK, assinado pela Oracle.
def servidorPacote = providers.gradleProperty('servidorPacote').getOrElse('https://missao-marte-servidor.onrender.com')
def jdkPacote = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
def pastaPacote = layout.buildDirectory.dir('pacote/MissaoMarte')

tasks.register('runtimePacote', Exec) {
    group = 'distribution'
    description = 'Monta o Java 17 enxuto (jlink) do pacote da apresentação.'
    def destino = layout.buildDirectory.dir('pacote-runtime')
    outputs.dir(destino)
    doFirst { delete destino }
    executable = jdkPacote.map { it.metadata.installationPath.file('bin/jlink').asFile.absolutePath }.get()
    // jdk.crypto.ec: HTTPS com o Render (TLS com curvas elípticas); jdk.unsupported: LWJGL.
    args '--add-modules', 'java.se,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.zipfs,jdk.localedata',
            '--no-header-files', '--no-man-pages', '--strip-debug', '--compress=2',
            '--output', destino.get().asFile.absolutePath
}

tasks.register('pacoteApresentacao', Sync) {
    group = 'distribution'
    description = 'Gera build/pacote/MissaoMarte: jogo + Java embutido + atalho .bat para a apresentação.'
    dependsOn tasks.named('installDist'), tasks.named('runtimePacote')
    inputs.property('servidor', servidorPacote)
    into pastaPacote
    from(layout.buildDirectory.dir('install/lwjgl3/lib')) { into 'app' }
    from(layout.buildDirectory.dir('pacote-runtime')) { into 'runtime' }
    doLast {
        def pasta = pastaPacote.get().asFile
        // cd para a pasta do .bat: o ranking local do convidado fica ao lado do jogo.
        new File(pasta, 'Jogar Missao Marte.bat').setText([
                '@echo off',
                'cd /d "%~dp0"',
                'start "" "%~dp0runtime\\bin\\javaw.exe" -Dmissaomarte.servidor=' + servidorPacote + ' -cp "%~dp0app\\*" ' + application.mainClass.get(),
        ].join('\r\n') + '\r\n', 'US-ASCII')
        new File(pasta, 'LEIA-ME.txt').setText([
                'MISSAO MARTE - versao da apresentacao (Fase 7)',
                '',
                '1. Extraia o .zip inteiro numa pasta (nao rode de dentro do .zip).',
                '2. Clique duas vezes em "Jogar Missao Marte.bat".',
                '   Nao precisa instalar Java: ele ja vem na pasta runtime.',
                '',
                "Servidor de ranking: ${servidorPacote}",
                'O servidor gratuito dorme apos 15 min sem uso: o primeiro login pode levar ate 1 minuto.',
                'Sem internet, o jogo funciona em modo convidado, com ranking local.',
                '',
                'Se o Windows mostrar "O Windows protegeu o computador", clique em',
                '"Mais informacoes" e depois em "Executar assim mesmo".',
        ].join('\r\n') + '\r\n', 'UTF-8')
    }
}

tasks.register('zipApresentacao', Zip) {
    group = 'distribution'
    description = 'Compacta o pacote em build/distributions/MissaoMarte-windows.zip.'
    dependsOn tasks.named('pacoteApresentacao')
    from(layout.buildDirectory.dir('pacote'))
    archiveFileName = 'MissaoMarte-windows.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
}
