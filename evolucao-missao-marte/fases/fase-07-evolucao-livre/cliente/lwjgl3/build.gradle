plugins {
    id 'application'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'br.unifor.missaomarte.lwjgl3.Lwjgl3Launcher'
    // GLFW precisa iniciar na primeira thread no macOS.
    if (System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('mac')) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

sourceSets.main.resources.srcDir rootProject.file('core/assets')

tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
    // -Dmissaomarte.servidor=... na linha do Gradle chega ao jogo (padrao: http://localhost:8080).
    systemProperty 'missaomarte.servidor', System.getProperty('missaomarte.servidor', 'http://localhost:8080')
}

tasks.register('runConsole', JavaExec) {
    group = 'application'
    description = 'Executa a interface de console preservada.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'br.unifor.missaomarte.lwjgl3.console.MainConsole'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    standardInput = System.in
    workingDir = rootProject.projectDir
}

// Verificação gráfica explícita: build/test comuns continuam sem exigir display.
tasks.register('smokeDesktop', JavaExec) {
    group = 'verification'
    description = 'Abre uma janela real e verifica render, resize e descarte.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.unifor.missaomarte.lwjgl3.VerificacaoDesktop'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    jvmArgs application.applicationDefaultJvmArgs
    workingDir = rootProject.projectDir
    args providers.gradleProperty('smokeOutput')
            .getOrElse(layout.buildDirectory.dir('reports/smoke').get().asFile.absolutePath)
}

// Fase 7: janela e relógio reais; a partida em tempo real anda sozinha até a vitória.
tasks.register('smokeTempoReal', JavaExec) {
    group = 'verification'
    description = 'Abre a janela e joga o modo tempo real: contagem, segurar direção, embarque automático, pausa e vitória.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.unifor.missaomarte.lwjgl3.VerificacaoTempoReal'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    jvmArgs application.applicationDefaultJvmArgs
    workingDir = rootProject.projectDir
    args providers.gradleProperty('smokeOutput')
            .getOrElse(layout.buildDirectory.dir('reports/smoke-tempo-real').get().asFile.absolutePath)
}

tasks.register('smokeInfinito', JavaExec) {
    group = 'verification'
    description = 'Abre a janela e joga o modo Infinito: setor 1, setor 2, fim da corrida e aba Infinito do ranking local.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.unifor.missaomarte.lwjgl3.VerificacaoInfinito'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    jvmArgs application.applicationDefaultJvmArgs
    workingDir = rootProject.projectDir
    args providers.gradleProperty('smokeOutput')
            .getOrElse(layout.buildDirectory.dir('reports/smoke-infinito').get().asFile.absolutePath)
}

// Ponta a ponta: exige o servidor no ar (cd ../servidor; gradlew bootRun). Gera as capturas da Fase 5.
tasks.register('smokeOnline', JavaExec) {
    group = 'verification'
    description = 'Abre a janela contra o servidor real: cadastro, login, envio, ranking, historico e falhas.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.unifor.missaomarte.lwjgl3.VerificacaoOnline'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    jvmArgs application.applicationDefaultJvmArgs
    workingDir = rootProject.projectDir
    args layout.buildDirectory.dir('reports/smoke-online').get().asFile.absolutePath,
            System.getProperty('missaomarte.servidor', 'http://localhost:8080')
}
