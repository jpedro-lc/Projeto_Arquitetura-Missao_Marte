  <script>
    (() => {
      const root = document.getElementById('mm-spacerage-preview');
      const canvas = root.querySelector('#mm-canvas');
      const ctx = canvas.getContext('2d');
      const selectResolution = root.querySelector('#mm-resolution');
      const selectBase = root.querySelector('#mm-base');
      const pauseButton = root.querySelector('#mm-pause');
      const menuButton = root.querySelector('#mm-menu');
      const caption = root.querySelector('#mm-status');
      const assets = JSON.parse(root.querySelector('#mm-assets').textContent);
      const images = {};
      const heights = {1366:768,1600:900,1920:1080};
      const defaults = {resolution:'1366',base:'idle',pause:false,menu:false,baseSize:138,spriteScale:1};
      const saved = globalThis.openai?.widgetState?.modelContent;
      const state = Object.assign({}, defaults, saved || {});
      let ready = false;
      let fontName = 'monospace';
      const palette = {text:'#dce7ec',muted:'#93adb9',line:'#547b8b',orange:'#d39859',cyan:'#8ec6ce'};

      function persist() {
        if (globalThis.openai?.setWidgetState) {
          globalThis.openai.setWidgetState({modelContent:{...state},privateContent:null}).catch(() => {});
        }
      }

      function normalise() {
        if (!heights[state.resolution]) state.resolution='1366';
        if (!['idle','active','landing','complete'].includes(state.base)) state.base='idle';
        state.baseSize=Math.max(105,Math.min(165,Number(state.baseSize)||138));
        state.spriteScale=Math.max(0.85,Math.min(1.2,Number(state.spriteScale)||1));
        selectResolution.value=state.resolution;
        selectBase.value=state.base;
        pauseButton.setAttribute('aria-pressed',String(!!state.pause));
        menuButton.setAttribute('aria-pressed',String(!!state.menu));
        pauseButton.textContent=state.pause?'Voltar à partida':'Ver pausa';
        menuButton.textContent=state.menu?'Voltar à partida':'Ver menu';
      }

      function cover(img,w,h) {
        const scale=Math.max(w/img.width,h/img.height);
        const sw=w/scale,sh=h/scale;
        ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,w,h);
      }

      function panel(img,x,y,w,h,border=22) {
        const srcX=[0,border,img.width-border,img.width];
        const srcY=[0,Math.min(border,img.height/3),img.height-Math.min(border,img.height/3),img.height];
        const b=Math.min(border*canvas.width/1366,h/3,w/4);
        const dstX=[x,x+b,x+w-b,x+w],dstY=[y,y+b,y+h-b,y+h];
        for(let row=0;row<3;row++) for(let col=0;col<3;col++) {
          ctx.drawImage(img,srcX[col],srcY[row],srcX[col+1]-srcX[col],srcY[row+1]-srcY[row],
            dstX[col],dstY[row],dstX[col+1]-dstX[col],dstY[row+1]-dstY[row]);
        }
      }

      function text(value,x,y,size,color=palette.text,align='left',maxWidth) {
        const visibleWidth=Math.max(canvas.clientWidth,320);
        const minimum=11*canvas.width/visibleWidth;
        ctx.font=`400 ${Math.max(size,minimum)}px ${fontName}`;
        ctx.textAlign=align;
        ctx.textBaseline='middle';
        ctx.fillStyle=color;
        if(maxWidth) ctx.fillText(value,x,y,maxWidth); else ctx.fillText(value,x,y);
      }

      function sprite(img,x,y,size) {
        const scale=size/Math.max(img.width,img.height);
        ctx.drawImage(img,Math.round(x-img.width*scale/2),Math.round(y-img.height*scale/2),
          Math.round(img.width*scale),Math.round(img.height*scale));
      }

      function key(label,x,y,width,scale) {
        const h=28*scale;
        ctx.fillStyle='#233b49';ctx.fillRect(x,y-h/2,width,h);
        ctx.strokeStyle=palette.line;ctx.lineWidth=Math.max(1,scale);ctx.strokeRect(x,y-h/2,width,h);
        text(label,x+width/2,y,15*scale,palette.text,'center',width-7*scale);
      }

      function drawOverlay(type,w,h,scale) {
        ctx.fillStyle='rgba(4,13,21,0.72)';ctx.fillRect(0,0,w,h);
        const menu=type==='menu';
        const pw=560*scale,ph=(menu?405:390)*scale;
        const px=(w-pw)/2,py=(h-ph)/2;
        panel(menu?images.menu:images.pause,px,py,pw,ph,25);
        text(menu?'MISSÃO MARTE':'MISSÃO EM PAUSA',w/2,py+66*scale,30*scale,palette.text,'center',pw-55*scale);
        text(menu?'RESGATE ESPACIAL':'A partida e o cronômetro permanecem pausados.',w/2,py+108*scale,
          15*scale,menu?palette.orange:palette.muted,'center',pw-55*scale);
        const labels=menu?['INICIAR JOGO','INSTRUÇÕES','SAIR']:['CONTINUAR','REINICIAR PARTIDA','VOLTAR AO MENU'];
        labels.forEach((label,i)=>{
          const bx=w/2-165*scale,by=py+(155+i*65)*scale;
          panel(images.button,bx,by,330*scale,49*scale,9);
          text(label,w/2,by+24*scale,17*scale,palette.text,'center',310*scale);
        });
      }

      function render() {
        normalise();
        if(!ready) return;
        const w=Number(state.resolution),h=heights[state.resolution];
        canvas.width=w;canvas.height=h;
        ctx.imageSmoothingEnabled=false;
        const s=w/1366;
        const small=canvas.clientWidth<600;
        const pad=12*s,topH=85*s,lowerH=65*s;
        const footerH=(small?112:84)*s;
        const topY=10*s,lowerY=topY+topH-3*s;
        const playTop=lowerY+lowerH-2*s;
        const footerY=h-footerH-10*s;
        const playBottom=footerY+2*s;
        cover(images.bg,w,h);
        const world={cx:w/2,cy:(playTop+playBottom)/2,
          dx:(w-130*s)/11,dy:(playBottom-playTop-80*s)/11};
        const position=(x,y)=>({x:world.cx+x*world.dx,y:world.cy-y*world.dy});
        const allAboard=state.base!=='idle';
        const landed=['landing','complete'].includes(state.base);
        const base=position(0,0);
        sprite(images[state.base],base.x,base.y,state.baseSize*s);
        const rocks=[[-2,3],[4,-2]];
        rocks.forEach(([x,y],i)=>{const p=position(x,y);sprite(images.asteroid,p.x,p.y,(i?82:91)*s*state.spriteScale);});
        [[-4,2],[3,3]].forEach(([x,y])=>{const p=position(x,y);sprite(images.enemy,p.x,p.y,75*s*state.spriteScale);});
        if(!allAboard) [[-3,-1],[3,-2]].forEach(([x,y])=>{const p=position(x,y);sprite(images.astronaut,p.x,p.y,47*s*state.spriteScale);});
        const ship=position(landed?0:1,landed?0:-3);
        sprite(images.ship,ship.x,ship.y,(landed?73:82)*s*state.spriteScale);

        panel(images.top,pad,topY,w-2*pad,topH,22);
        const columns=(w-2*pad)/4;
        const labels=small?['PONTOS','DIFIC.','MOVIM.','TEMPO']:['PONTOS','DIFICULDADE','MOVIMENTOS','TEMPO'];
        const values=[allAboard?'00088':'00063','MÉDIO',allAboard?'17':'12','01:35'];
        labels.forEach((label,i)=>{
          const x=pad+columns*(i+0.5);
          if(i>0){ctx.strokeStyle='rgba(105,139,154,.35)';ctx.lineWidth=s;ctx.beginPath();ctx.moveTo(pad+i*columns,topY+15*s);ctx.lineTo(pad+i*columns,topY+topH-15*s);ctx.stroke();}
          text(label,x,topY+27*s,17*s,palette.muted,'center',columns-22*s);
          text(values[i],x,topY+56*s,25*s,palette.text,'center',columns-22*s);
        });
        panel(images.lower,pad,lowerY,w-2*pad,lowerH,22);
        const midY=lowerY+lowerH/2;
        text('VIDAS',pad+39*s,midY,18*s,palette.muted,'left',100*s);
        for(let i=0;i<2;i++) sprite(images.ship,pad+(172+i*48)*s,midY,42*s);
        ctx.strokeStyle='rgba(105,139,154,.35)';ctx.lineWidth=s;ctx.beginPath();ctx.moveTo(w/2,lowerY+13*s);ctx.lineTo(w/2,lowerY+lowerH-13*s);ctx.stroke();
        sprite(images.astronaut,w/2+48*s,midY,39*s);
        text(small?'PASSAG.':'PASSAGEIROS',w/2+84*s,midY,18*s,palette.muted,'left',(small?155:200)*s);
        text(allAboard?'5 / 5':'3 / 5',w-pad-55*s,midY,25*s,palette.text,'right',120*s);

        panel(images.footer,pad,footerY,w-2*pad,footerH,22);
        const cy=footerY+(small?30:27)*s;
        const groups=[{key:'WASD',label:'MOVER',kw:88},{key:'P',label:'PAUSA',kw:36},{key:'ESC',label:'MENU',kw:53}];
        groups.forEach((g,i)=>{
          const start=pad+35*s+i*(w-2*pad-70*s)/3;
          key(g.key,start,cy,g.kw*s,s);
          text('— '+g.label,start+(g.kw+16)*s,cy,17*s,palette.text,'left',(w/3-g.kw*s-55*s));
        });
        const second=small?'C — EMBARCAR   |   Q — ABORTAR   |   R — REINICIAR':'C — EMBARCAR     •     Q — ABORTAR     •     R — REINICIAR APÓS O FIM';
        text(second,w/2,footerY+(small?79:60)*s,15*s,palette.muted,'center',w-80*s);

        if(state.base==='complete'&&!state.pause&&!state.menu){
          const by=playBottom-65*s;
          panel(images.footer,w/2-220*s,by,440*s,50*s,18);
          text('MISSÃO CONCLUÍDA',w/2,by+25*s,19*s,palette.text,'center',400*s);
        }
        if(state.menu) drawOverlay('menu',w,h,s); else if(state.pause) drawOverlay('pause',w,h,s);
        canvas.dataset.resolution=`${w}x${h}`;
        canvas.dataset.base=state.base;
        canvas.dataset.worldOrigin=`${base.x.toFixed(2)},${base.y.toFixed(2)}`;
        canvas.dataset.background='cover';
        root.dataset.ready='true';
        caption.textContent=`Prévia de aprovação · valores ilustrativos · ${w} × ${h}`;
        canvas.setAttribute('aria-label',`Prévia ${w} por ${h}. Fundo SpaceRage em toda a janela, HUD integrado, base ${state.base} na origem lógica zero, zero. ${state.menu?'Menu principal.':state.pause?'Pausa aberta.':'Partida.'}`);
      }

      selectResolution.addEventListener('change',()=>{state.resolution=selectResolution.value;render();persist();});
      selectBase.addEventListener('change',()=>{state.base=selectBase.value;state.menu=false;state.pause=false;render();persist();});
      pauseButton.addEventListener('click',()=>{state.pause=!state.pause;state.menu=false;render();persist();});
      menuButton.addEventListener('click',()=>{state.menu=!state.menu;state.pause=false;render();persist();});
      window.addEventListener('openai:set_globals',event=>{
        const incoming=event.detail?.globals?.widgetState?.modelContent;
        if(incoming){Object.assign(state,incoming);render();}
      });
      new ResizeObserver(()=>{if(ready)render();}).observe(canvas.parentElement);
      const loadImages=Object.entries(assets).filter(([name])=>name!=='font').map(([name,url])=>new Promise((resolve,reject)=>{
        const image=new Image();image.onload=()=>{images[name]=image;resolve();};image.onerror=reject;image.src=url;
      }));
      const loadFont=new FontFace('MMAudiowide',`url(${assets.font})`).load().then(font=>{document.fonts.add(font);fontName='MMAudiowide';});
      Promise.all([...loadImages,loadFont]).then(()=>{
        ready=true;render();
        if(globalThis.Tweak){
          const tweak=new Tweak({container:canvas.parentElement,onChange:()=>{render();persist();}});
          tweak.addSlider(state,'baseSize',{label:'Tamanho da plataforma',min:105,max:165,step:1,unit:'px'});
          tweak.addSlider(state,'spriteScale',{label:'Tamanho das entidades',min:0.85,max:1.2,step:0.05});
        }
      }).catch(()=>{caption.textContent='Não foi possível carregar os assets da prévia.';caption.setAttribute('role','alert');root.dataset.ready='error';});
    })();
  </script>
</div>
